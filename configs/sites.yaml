# Sites used for training / inference. site_id is a model input (static categorical).
# azimuth_deg is a compass bearing: 180 = facing south (converted per API in the ingest code).
sites:
  - site_id: "lahore_pvgis_01"
    source: "pvgis"              # simulated
    is_simulated: true
    latitude: 31.5204
    longitude: 74.3587
    panel_capacity_kw: 10.0
    tilt_deg: 20
    azimuth_deg: 180
    system_loss_pct: 14          # PVGIS default (cables, inverter, soiling)

  # Real rooftop (Member 1's home). TEST data only - never used for training.
  # Cleaned by `python -m solarcast.data.real` (owner's machine; raw exports aren't shared).
  - site_id: "lahore_home_01"
    source: "inverter"
    is_simulated: false
    vendor: "solarmax_solar_of_things"   # SolarMax SOLON DUAL hybrid, "Solar of Things" portal
    latitude: 31.44              # portal location, rounded to 2 decimals (~1 km) for privacy
    longitude: 74.29
    installed: "2025-06-16"      # portal "Installed Date"; earlier days are dropped
    inverter_kw: 3.8             # nameplate: SolarMax SM-SOLON-DUAL-3.8KW, 3800 W AC, 24 V battery
                                 # portal reports "3.5KW 24V" / 3500 W for this unit - reason not known yet
    pv_input_max_w: 6000         # nameplate MPPT rating; MPPT 60-450 V, max Voc 500 V
    grid_feed_in: false          # export "On Grid Enable Status: Disable" -> solar can be held back
    azimuth_deg: 180             # from the data: production centred at 11:52 vs solar noon 11:48
    tilt_deg: null               # TODO(owner): measure with a level app
    # Panel expansion: August 2025 (owner confirmed), unchanged since. Exact day not known: the
    # data's first day above the old system's best is 2025-08-11 (29.5 kWh; max before: 20.3).
    # Only daily-only data falls in that week, so the day doesn't affect hourly testing.
    # TODO(owner): panel kW = panel count x Pmax, before and after, then fill in:
    #   capacity_history:
    #     - {from: "2025-06-16", panel_capacity_kw: ...}
    #     - {from: "2025-08-11", panel_capacity_kw: ...}
    capacity_history: null
    export_folder: "home_01"     # data/inverter/home_01/ (git-ignored, never pushed)
    export_hour_timezone: "Asia/Shanghai"   # portal's hourly columns are UTC+8 (checked)
