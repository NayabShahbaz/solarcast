[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarcast"
version = "0.1.0"
description = "Day-ahead hourly rooftop solar forecasting for Lahore - MLOps pipeline on AWS"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.2,<3",  # pandas 3 not yet supported by pytorch-forecasting (Member 2)
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "boto3>=1.28",
]

# Install only what your component needs, e.g.  pip install -e ".[data,dev]"
[project.optional-dependencies]
# Member 1 - ingestion, validation, orchestration, monitoring
data = [
    "requests>=2.31",
    "pandera>=0.18",
    "dvc[s3]>=3.0",
    "prefect>=2.14",
    "evidently>=0.4",
    "pyarrow>=14.0",
]
# Member 2 - models & experiment tracking
train = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "torch>=2.1",
    "lightning>=2.1",
    "pytorch-forecasting>=1.0",
    "chronos-forecasting>=1.2",
    "mlflow>=2.9,<4",  # DagsHub hosted MLflow supports 3.x; recheck before allowing 4.x
]
# Member 3 - API & dashboard
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "mlflow>=2.9,<4",  # DagsHub hosted MLflow supports 3.x; recheck before allowing 4.x
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "requests>=2.31",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.3",
    "pre-commit>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
