# Single source of truth for pipeline parameters (read by src/solarcast/config.py).
data:
  start_date: "2023-01-01"
  end_date: "2025-12-31"
  timezone: "Asia/Karachi"     # local time for calendar features; data stored in UTC
  freq: "1h"
  max_gap_hours_interpolate: 3   # gaps <= this are interpolated; longer gaps are dropped/flagged
  night_ghi_threshold_wm2: 5     # below this, generation is forced to 0

split:                           # chronological, no shuffling
  train_end: "2025-06-30"
  val_end: "2025-09-30"

window:
  history_hours: 168             # 7 days
  horizon_hours: 24

tft:
  hidden_size: 16
  attention_head_size: 2
  dropout: 0.1
  learning_rate: 0.03
  max_epochs: 20
  batch_size: 64
  quantiles: [0.1, 0.5, 0.9]

promotion:
  metric: "mae_kwh"
  max_relative_degradation: 0.0  # candidate must be <= current production MAE

monitoring:
  drift_share_threshold: 0.5     # retrain if share of drifted columns exceeds this
  mae_threshold_kwh: null        # set after first production model is evaluated
