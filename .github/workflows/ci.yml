# [Member 3] CI: lint + tests on every PR and push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[api,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
