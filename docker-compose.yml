# Local development stack.
#   docker compose up --build                        API + dashboard + Prefect (MLflow = DagsHub, from .env)
#   docker compose --profile pipeline up --build     ... plus the Prefect pipeline worker
#   docker compose --profile offline up mlflow       local MLflow only, for working without internet
#
# MLflow is NOT run locally by default: the team shares DagsHub's hosted MLflow
# (MLFLOW_TRACKING_URI etc. in .env). Offline mode: set MLFLOW_TRACKING_URI=http://localhost:5000
# for scripts on your laptop, or http://mlflow:5000 for containers in this file.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]
    profiles: ["offline"]

  prefect:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports: ["4200:4200"]

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    ports: ["8000:8000"]

  dashboard:
    build: { context: ., dockerfile: docker/dashboard.Dockerfile }
    env_file: .env
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    volumes: ["./reports:/app/reports:ro"]
    depends_on: [api]

  pipeline:
    build: { context: ., dockerfile: docker/pipeline.Dockerfile }
    env_file: .env
    environment:
      PREFECT_API_URL: http://prefect:4200/api
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    depends_on: [prefect]
    profiles: ["pipeline"]

volumes:
  mlflow_data:
